version: '3.8'

services:
  backend:
    build:
      context: ./streetcats-backend
      dockerfile: Dockerfile
    container_name: streetcats-backend
    ports:
      - "3000:3000"
    volumes:
      - ./streetcats-backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - ./streetcats-backend/.env

  frontend:
    build:
      context: ./streetcats-frontend
      dockerfile: Dockerfile
    container_name: streetcats-frontend
    ports:
      - "4200:4200"
    volumes:
      - ./streetcats-frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
