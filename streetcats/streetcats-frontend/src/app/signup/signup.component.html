<main class="auth-page">
  <h1>Crea un account</h1>
  <p class="auth-subtitle">Unisciti alla comunità e inizia a segnalare i gatti del quartiere</p>

  @if (errorMessage) {
    <div class="alert">
      <span>{{ errorMessage }}</span>
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <label>
      Nome utente
      <input type="text" formControlName="userName" placeholder="mario_rossi" autocomplete="username">
      @if (form.get('userName')?.invalid && form.get('userName')?.touched) {
        <span class="field-error">Minimo 3 caratteri, massimo 50.</span>
      }
    </label>

    <label>
      Indirizzo email
      <input type="email" formControlName="email" placeholder="mario@example.com" autocomplete="email">
      @if (form.get('email')?.invalid && form.get('email')?.touched) {
        <span class="field-error">Inserisci un indirizzo email valido.</span>
      }
    </label>

    <label>
      Password
      <input type="password" formControlName="password" placeholder="Almeno 6 caratteri" autocomplete="new-password">
      @if (form.get('password')?.invalid && form.get('password')?.touched) {
        <span class="field-error">Minimo 6 caratteri.</span>
      }
    </label>

    <hr>

    <button type="submit" class="btn-primary">
      Crea l'account
    </button>
  </form>

  <p class="auth-footer">
    Hai già un account? <a routerLink="/login">Accedi</a>
  </p>
</main>
