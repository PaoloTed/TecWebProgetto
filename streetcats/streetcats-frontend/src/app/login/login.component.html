<div class="min-h-[80vh] flex items-center justify-center px-4">
  <div class="w-full max-w-[420px]">

    <!-- Logo + heading -->
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-white mb-1">Bentornato su StreetCats</h1>
      <p class="text-sm text-text-secondary">Inserisci le tue credenziali per continuare</p>
    </div>

    <!-- Card -->
    <div class="bg-background border border-border-subtle p-8">

      <!-- Error alert -->
      @if (errorMessage) {
        <div class="flex items-start gap-2.5 p-2.5 text-[15px] bg-danger/10 text-[#fda4af] mb-6">
          <span>{{ errorMessage }}</span>
        </div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">

        <!-- Email -->
        <div class="flex flex-col gap-1.5">
          <label for="email" class="text-[10px] font-semibold tracking-wider text-text-muted">Indirizzo email</label>
          <input id="email" type="email" formControlName="email" class="block w-full bg-background border border-border-subtle p-2.5 text-[15px] text-text-main outline-none focus:ring-2 focus:ring-primary"
                 placeholder="mario@example.com" autocomplete="email">
        </div>

        <!-- Password -->
        <div class="flex flex-col gap-1.5">
          <label for="password" class="text-[10px] font-semibold tracking-wider text-text-muted">Password</label>
          <input id="password" type="password" formControlName="password" class="block w-full bg-background border border-border-subtle p-2.5 text-[15px] text-text-main outline-none focus:ring-2 focus:ring-primary"
                 placeholder="••••••••" autocomplete="current-password">
        </div>

        <!-- Divider -->
        <hr class="border-t border-border-subtle w-full my-1">

        <!-- Submit -->
        <button type="submit" [disabled]="loginForm.invalid || isLoading" class="bg-primary hover:bg-primary-hover text-white px-5 py-[15px] text-[15px] font-medium flex items-center justify-center gap-1.2 cursor-pointer transition-opacity disabled:opacity-40 disabled:cursor-not-allowed w-full">
          Accedi all'account
        </button>

      </form>
    </div>

    <!-- Footer -->
    <p class="text-center text-[15px] mt-25 text-text-muted">
      Non hai un account?&nbsp;
      <a routerLink="/signup" class="text-primary hover:underline font-bold">Registrati</a>
    </p>

  </div>
</div>
