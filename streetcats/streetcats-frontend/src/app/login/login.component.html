<main class="auth-page">
  <h1>Bentornato su StreetCats</h1>
  <p class="auth-subtitle">Inserisci le tue credenziali per continuare</p>

  @if (errorMessage) {
    <div class="alert">
      <span>{{ errorMessage }}</span>
    </div>
  }

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <label>
      Indirizzo email
      <input type="email" formControlName="email" placeholder="mario@example.com" autocomplete="email">
    </label>

    <label>
      Password
      <input type="password" formControlName="password" placeholder="••••••••" autocomplete="current-password">
    </label>

    <hr>

    <button type="submit" [disabled]="loginForm.invalid" class="btn-primary">
      Accedi all'account
    </button>
  </form>

  <p class="auth-footer">
    Non hai un account? <a routerLink="/signup">Registrati</a>
  </p>
</main>
