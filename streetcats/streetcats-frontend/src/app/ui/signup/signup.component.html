<main>
  <h1 style="font-size: 24px; margin-bottom: 5px;">Crea un account</h1>
  <p class="text-secondary" style="font-size: 14px; margin-bottom: 30px;">Unisciti alla comunita e inizia a
    segnalare i gatti del quartiere</p>


  <form [formGroup]="form" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 20px;">
    <label class="form-label">
      Nome utente
      <input type="text" formControlName="userName" placeholder="mario_rossi" autocomplete="username">
      @if (form.get('userName')?.invalid && form.get('userName')?.touched) {
      <span style="font-size: 12px; color: var(--danger); margin-top: 4px; display: block;">Minimo 3 caratteri,
        massimo 50.</span>
      }
    </label>

    <label class="form-label">
      Indirizzo email
      <input type="email" formControlName="email" placeholder="mario@example.com" autocomplete="email">
      @if (form.get('email')?.invalid && form.get('email')?.touched) {
      <span style="font-size: 12px; color: var(--danger); margin-top: 4px; display: block;">Inserisci un indirizzo
        email valido.</span>
      }
    </label>

    <label class="form-label">
      Password
      <input type="password" formControlName="password" placeholder="Almeno 6 caratteri" autocomplete="new-password">
      @if (form.get('password')?.invalid && form.get('password')?.touched) {
      <span style="font-size: 12px; color: var(--danger); margin-top: 4px; display: block;">Minimo 6
        caratteri.</span>
      }
    </label>

    <hr>

    <button type="submit" class="btn-primary" style="align-self: flex-start;">
      Crea l'account
    </button>
  </form>

  <p class="text-secondary" style="margin-top: 25px;">
    Hai gia un account? <a routerLink="/login" style="color: var(--primary); font-weight: bold;">Accedi</a>
  </p>
</main>
