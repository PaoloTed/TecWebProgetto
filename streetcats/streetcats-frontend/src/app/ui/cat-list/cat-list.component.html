<header>
  <div>
    <h1>Gatti di strada <span>nella tua zona</span></h1>
    <p>Segnala un avvistamento o sfoglia i mici del quartiere.</p>
  </div>
</header>


<!-- Mappa  -->
<div style=" background: var(--bg-main); border: 1px solid var(--bg-alt); padding: 20px;">
  <app-map mode="view-all" [cats]="cats" height="480px" (catClicked)="onCatClicked($event)">
  </app-map>
</div>

<!-- segnalazioni -->
<p style="text-align: center; font-size: 15px; color: var(--text-alt);">
  Segnalazioni attive: <strong style="color: var(--primary); font-size: 18px;">{{ cats.length }}</strong>
</p>
