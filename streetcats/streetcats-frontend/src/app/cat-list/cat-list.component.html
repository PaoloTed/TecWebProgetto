<header>
  <div>
    <h1>Gatti di strada <span>nella tua zona</span></h1>
    <p>Segnala un avvistamento o sfoglia i mici del quartiere.</p>
  </div>
</header>

<!--  ERROR  -->
@if (error) {
<div
  style="display: flex; gap: 10px; padding: 10px 15px; font-size: 15px; background: var(--color-danger-bg); color: var(--color-danger-text); max-width: 580px;">
  <h3>Impossibile caricare i dati</h3>
  <p>{{ error }}</p>
</div>
}


<!-- Mappa  -->
<div style=" background: var(--color-background); border: 1px solid var(--color-border); padding: 20px;">
  <app-map mode="view-all" [cats]="catsWithCoords" height="480px" (catClicked)="onCatClicked($event)">
  </app-map>
</div>

<!-- segnalazioni -->
<p style="text-align: center; font-size: 15px; color: var(--color-text-secondary);">
  Segnalazioni attive: <strong style="color: var(--color-primary); font-size: 18px;">{{ cats.length }}</strong>
</p>
