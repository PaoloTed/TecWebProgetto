<nav class="sticky top-0 z-50 bg-background border-b border-border-subtle">
  <div class="w-full px-6 h-[60px] flex items-center justify-between box-border">

    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-2.5 cursor-pointer">
      <span class="w-[30px] h-[30px] bg-primary inline-flex items-center justify-center shrink-0 overflow-hidden">
        <img src="/gattologo.webp" class="w-full h-full object-contain p-0.5">
      </span>
      <span class="text-[15px] text-white tracking-tight font-bold">StreetCats</span>
    </a>

    <!-- Nav links + Actions -->
    <div class="flex items-center gap-1">

      <a routerLink="/cats" class="px-4 py-1.5 text-[15px] font-medium text-text-secondary hover:text-text-main transition-colors">
        Esplora gatti
      </a>

      @if (authService.isAuthenticated()) {
        <a routerLink="/profile" class="px-4 py-1.5 text-[15px] font-medium text-text-secondary hover:text-text-main transition-colors">
          Il mio profilo
        </a>
        <span class="w-px h-5 bg-border-subtle mx-1.5 inline-block"></span>
        <button (click)="logout()" class="bg-white/5 hover:bg-white/10 text-text-main px-[15px] py-2.5 text-[10px] font-medium flex items-center justify-center gap-1.2 cursor-pointer transition-opacity">Esci</button>
      } @else {
        <span class="w-px h-5 bg-border-subtle mx-1.5 inline-block"></span>
        <a routerLink="/login" class="bg-primary hover:bg-primary-hover text-white px-[15px] py-2.5 text-[10px] font-medium flex items-center justify-center gap-1.2 cursor-pointer transition-opacity">Accedi</a>
      }
    </div>
  </div>
</nav>
