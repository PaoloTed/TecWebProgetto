<nav>
  <div class="nav-container">

    <!-- Logo -->
    <a routerLink="/" class="logo-link">
      <span class="logo-bg">
        <img src="/gattologo.webp" alt="Logo StreetCats">
      </span>
      <span class="logo-text">StreetCats</span>
    </a>

    <!-- Nav links + Actions -->
    <div class="nav-links">

      <a routerLink="/cats" class="nav-link">
        Esplora gatti
      </a>

      @if (authService.isAuthenticated()) {
        <a routerLink="/profile" class="nav-link">
          Il mio profilo
        </a>
        <span class="nav-sep"></span>
        <button (click)="logout()" class="btn-ghost btn-sm">Esci</button>
      } @else {
        <span class="nav-sep"></span>
        <a routerLink="/login" class="btn-primary btn-sm">Accedi</a>
      }
    </div>
  </div>
</nav>
