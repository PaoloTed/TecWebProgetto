<nav style="position: sticky; top: 0; z-index: 50; background: var(--color-background); border-bottom: 1px solid var(--color-border);">
  <div style="width: 100%; padding: 0 25px; height: 60px; display: flex; align-items: center; justify-content: space-between; box-sizing: border-box;">

    <!-- Logo -->
    <a routerLink="/" style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
      <span style="width: 30px; height: 30px; background: var(--color-primary); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden;">
        <img src="/gattologo.webp" style="width: 100%; height: 100%; object-fit: contain; padding: 2px;">
      </span>
      <span style="font-size: 15px; color: white; letter-spacing: -0.01em;"><b>StreetCats</b></span>
    </a>

    <!-- Nav links + Actions -->
    <div style="display: flex; align-items: center; gap: 4px;">

      <a routerLink="/cats" class="nav-link"
         style="padding: 5px 15px; font-size: 15px; font-weight: 500; color: var(--color-text-secondary);">
        Esplora gatti
      </a>

      @if (authService.isAuthenticated()) {
        <a routerLink="/profile" class="nav-link"
           style="padding: 5px 15px; font-size: 15px; font-weight: 500; color: var(--color-text-secondary);">
          Il mio profilo
        </a>
        <span style="width: 1px; height: 20px; background: var(--color-border); margin: 0 5px; display: inline-block;"></span>
        <button (click)="logout()" class="btn-ghost btn-sm">Esci</button>
      } @else {
        <span style="width: 1px; height: 20px; background: var(--color-border); margin: 0 5px; display: inline-block;"></span>
        <a routerLink="/login" class="btn-primary btn-sm">Accedi</a>
      }
    </div>
  </div>
</nav>
