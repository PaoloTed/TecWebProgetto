<footer style="border-top: 1px solid var(--c-border); background: rgba(8,12,20,0.8); margin-top: auto;">
  <div style="width: 100%; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; box-sizing: border-box;">
    <div style="display: flex; align-items: center; gap: 8px; cursor: pointer;" (click)="playMeow()">
      <span style="width: 26px; height: 26px; border-radius: 7px; background: var(--c-primary); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden;">
        <img src="/gattologo.webp" alt="StreetCats Logo" style="width: 100%; height: 100%; object-fit: contain; padding: 2px;">
      </span>
      <span style="font-weight: 700; font-size: 0.9375rem; color: white;">StreetCats</span>
      <span style="color: var(--c-subtle); font-size: 0.875rem;">— Progetto TecWeb 2025</span>
    </div>
    <div style="display: flex; align-items: center; gap: 20px; font-size: 0.8125rem; color: var(--c-subtle);">
      <a href="#" style="color: inherit; text-decoration: none;">Informazioni</a>
      <a href="#" style="color: inherit; text-decoration: none;">Privacy</a>
      <span>&copy; 2026</span>
    </div>
  </div>
  @if (catFact) {
    <div style="width: 100%; padding: 12px 24px; border-top: 1px solid rgba(255,255,255,0.04); text-align: center; font-size: 0.8125rem; color: var(--c-muted); font-style: italic;">
      <strong>Lo sapevi?</strong> {{ catFact }}
    </div>
  }
</footer>
