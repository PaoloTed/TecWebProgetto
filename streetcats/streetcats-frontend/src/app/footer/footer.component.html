<footer style="border-top: 1px solid var(--color-border); background: var(--color-background); margin-top: auto;">
  <div style="width: 100%; padding: 20px 25px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; box-sizing: border-box;">
    <div style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
      <span style="width: 25px; height: 25px; background: var(--color-primary); display: inline-flex; align-items: center; justify-content: center; ">
        <img src="/gattologo.webp" style="width: 100%; height: 100%; object-fit: contain; padding: 2px;">
      </span>
      <span style="font-size: 15px; color: white;"><b>StreetCats</b></span>
      <span style="color: var(--color-text-muted); font-size: 10px;">- Progetto TecWeb 2025</span>
    </div>
  </div>
  @if (catFact) {
    <div style="width: 100%; padding: 10px 25px; border-top: 1px solid rgba(255,255,255,0.04); text-align: center; font-size: 10px; color: var(--color-text-secondary);">
      <strong>Lo sapevi?</strong> <i>{{ catFact }}</i>
    </div>
  }
</footer>
